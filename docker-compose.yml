services:
  postgres:
    image: postgres:18
    container_name: dropthing-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dropthing
      POSTGRES_DB: dropthing
    ports:
      - '6543:5432'
    volumes:
      # PGDATA de l'image postgres:18 est /var/lib/postgresql/18/docker —
      # monter …/18/data envoyait les données dans un volume anonyme,
      # perdues à chaque `docker compose down`.
      - pgdata:/var/lib/postgresql/18/docker

volumes:
  pgdata:
